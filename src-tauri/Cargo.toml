[package]
name = "championify-redux"
version = "3.0.0"
description = "Scrape your favorite websites for League of Legends's best builds."
authors = ["BellezaEmporium"]
license = ""
repository = "BellezaEmporium/Championify_RW#rework"
edition = "2024"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = ["config-json5"] }

[dependencies]
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.28"
tauri = { version = "2.9.1", features = ["config-json5"] }
tauri-plugin-log = "2.7.1"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-shell = "2.3.3"
tauri-plugin-fs = "2.4.4"
tauri-plugin-os = "2.3.2"

# HTTP client for scrapers
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.48.0", features = ["full"] }

# HTML parsing for scrapers
scraper = "0.24.0"
select = "0.6.1"

# File system operations
dirs = "6.0"
walkdir = "2.5"

# Error handling
thiserror = "2.0"
anyhow = "1.0.100"
env_logger = "0.11.8"

# Async utilities
futures = "0.3.31"
async-trait = "0.1.89"
once_cell = "1.21.3"
chrono = { version = "0.4", features = ["serde"] }
sys-locale = "0.3.2"
