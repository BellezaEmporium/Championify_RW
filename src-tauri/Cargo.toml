[package]
name = "championify-redux"
version = "3.0.0"
description = "Scrape your favorite websites for League of Legends's best builds."
authors = ["BellezaEmporium"]
license = ""
repository = "BellezaEmporium/Championify_RW#rework"
edition = "2024"
rust-version = "1.94.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = ["config-json5"] }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.29"
tauri = { version = "2.10.3", features = ["config-json5"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.4.5"
tauri-plugin-os = "2.3.2"

# HTTP client for scrapers
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
tokio = { version = "1.50.0", features = ["full"] }

# HTML parsing for scrapers
scraper = "0.26.0"
select = "0.6.1"

# File system operations
dirs = "6.0.0"
walkdir = "2.5.0"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"
env_logger = "0.11.9"

# Async utilities
futures = "0.3.32"
async-trait = "0.1.89"
once_cell = "1.21.4"
chrono = { version = "0.4.44", features = ["serde"] }
sys-locale = "0.3.2"
